      tags:
        - users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                secret:
                  type: string
              required:
                - secret
      responses:
        '400':
          description: Invalid Quick Connect secret
        '204':
          description: Account successfully linked
        '401':
          description: Unauthorized
        '422':
          description: Account already linked
        '500':
          description: Server error
