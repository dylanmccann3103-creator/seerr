  /settings/cache:
    get:
      summary: Get a list of active caches
      description: Retrieves a list of all active caches and their current stats.
      tags:
        - settings
      responses:
        '200':
          description: Caches returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  imageCache:
                    type: object
                    properties:
                      tpdb:
                        type: object
                        properties:
                          size:
                            type: number
                            example: 123456
                          imageCount:
                            type: number
                            example: 123
                      avatar:
                        type: object
                        properties:
                          size:
                            type: number
                            example: 123456
                          imageCount:
                            type: number
                            example: 123
                  dnsCache:
                    type: object
                    properties:
                      stats:
                        type: object
                        properties:
                          size:
                            type: number
                            example: 1
                          maxSize:
                            type: number
                            example: 500
                          hits:
                            type: number
                            example: 19
                          misses:
                            type: number
                            example: 1
                          failures:
                            type: number
                            example: 0
                          ipv4Fallbacks:
                            type: number
                            example: 0
                          hitRate:
                            type: number
                            example: 0.95
                      entries:
                        type: array
                        additionalProperties:
                          type: object
                          properties:
                            addresses:
                              type: object
                              properties:
                                ipv4:
                                  type: number
                                  example: 1
                                ipv6:
                                  type: number
                                  example: 1
                            activeAddress:
                              type: string
                              example: 127.0.0.1
                            family:
                              type: number
                              example: 4
                            age:
                              type: number
                              example: 10
                            ttl:
                              type: number
                              example: 10
                            networkErrors:
                              type: number
                              example: 0
                            hits:
                              type: number
                              example: 1
                            misses:
                              type: number
                              example: 1
                  apiCaches:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: cache-id
                        name:
                          type: string
                          example: cache name
                        stats:
                          type: object
                          properties:
                            hits:
                              type: number
                            misses:
                              type: number
                            keys:
                              type: number
                            ksize:
                              type: number
                            vsize:
                              type: number
  /settings/cache/{cacheId}/flush:
    post:
      summary: Flush a specific cache
      description: Flushes all data from the cache ID provided
      tags:
        - settings
      parameters:
        - in: path
          name: cacheId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'Flushed cache'
  /settings/cache/dns/{dnsEntry}/flush:
    post:
      summary: Flush a specific DNS cache entry
      description: Flushes a specific DNS cache entry
      tags:
        - settings
      parameters:
        - in: path
          name: dnsEntry
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'Flushed dns cache'
  /settings/logs:
    get:
      summary: Returns logs
      description: Returns list of all log items and details
      tags:
        - settings
      parameters:
        - in: query
          name: take
          schema:
            type: number
            nullable: true
            example: 25
        - in: query
          name: skip
          schema:
            type: number
            nullable: true
            example: 0
        - in: query
          name: filter
          schema:
            type: string
            nullable: true
            enum: [debug, info, warn, error]
            default: debug
        - in: query
          name: search
          schema:
            type: string
            nullable: true
            example: whisparr
      responses:
        '200':
          description: Server log returned
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    label:
                      type: string
                      example: server
                    level:
                      type: string
                      example: info
                    message:
                      type: string
                      example: Server ready on port 5055
                    timestamp:
                      type: string
                      example: '2020-12-15T16:20:00.069Z'
